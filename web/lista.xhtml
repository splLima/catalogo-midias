<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Lista de Itens</title>
</h:head>
<h:body>
    <h1>Lista de Itens</h1>

    <h:form>
        Buscar: <h:inputText value="#{catalogoBean.termoBusca}" />
        <h:commandButton value="Consultar" action="#{catalogoBean.buscar()}" />
        <h:commandButton value="Limpar" action="#{catalogoBean.limparBusca()}" />
    </h:form>
    <br/>

    <h:form>
        <h:dataTable value="#{catalogoBean.lista}" var="i" border="1" cellpadding="5">
            <h:column>
                <f:facet name="header">ID</f:facet>
                #{i.id}
            </h:column>
            <h:column>
                <f:facet name="header">Título</f:facet>
                #{i.titulo}
            </h:column>
            <h:column>
                <f:facet name="header">Tipo</f:facet>
                #{i.tipo}
            </h:column>
            <h:column>
                <f:facet name="header">Gênero</f:facet>
                #{i.genero}
            </h:column>
            <h:column>
                <f:facet name="header">Autor</f:facet>
                #{i.autor}
            </h:column>
            <h:column>
                <f:facet name="header">Ano</f:facet>
                #{i.ano}
            </h:column>
            <h:column>
                <f:facet name="header">Ações</f:facet>
                <h:commandButton value="Editar" action="#{catalogoBean.prepararEdicao(i)}" />
                <h:commandButton value="Excluir" action="#{catalogoBean.excluir(i)}" onclick="return confirm('Tem certeza?');" />
            </h:column>
        </h:dataTable>
    </h:form>

    <br/>
    <h:link value="Voltar ao Menu" outcome="index"/>
</h:body>
</html>
